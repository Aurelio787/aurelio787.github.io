<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC-Konfigurator</title>
    
    <script src="darkmode.js" defer></script>
    <script src="code.js" defer></script> 
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    
    <h1>PC-Konfigurator</h1>
    <p>Wähle die Komponenten für deinen PC aus:</p>
    
    <label for="category-select">Kategorie:</label>
    <div class="search-container">
    <select id="category-select">
    <option value="all">Alle</option>
    <option value="GPU">GPU</option>            
    <option value="CPU">CPU</option>             
    <option value="PSU">PSU</option>            
    <option value="Motherboard">Motherboard</option>             
    <option value="RAM">RAM</option>             
    <option value="SSD">SSD</option>             
    <option value="Cases">Gehäuse</option>             
    <option value="Coolers">Kühler</option>             
    <option value="thermal_paste">Wärmeleitpaste</option>             
    <option value="fans">Lüfter</option>         
    </select> 
        

    </div>

    <input type="text" id="search-input" placeholder="Suche nach Komponenten...">
    <button id="search-button">Suchen</button>

    <div id="show-results"></div>

    <input type="checkbox" id="theme-switch">
    <div class="display">
        <label for="theme-switch">
            <div class="circle">
                <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0-1.06 1.06l-1.591-1.59a.75.75 0 1 0-1.06 1.06l1.591 1.59a.75.75 0 0 0 1.06 0ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM6.166 18.894a.75.75 0 0 0 1.06 0l1.591-1.591a.75.75 0 1 0-1.06-1.06l-1.591 1.59a.75.75 0 0 0 0 1.06ZM3 12a.75.75 0 0 1 .75-.75h2.25a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12ZM6.166 5.106a.75.75 0 0 0 0 1.06l1.591 1.591a.75.75 0 1 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.06 0Z"/>
                </svg>
                <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
                </svg>
            </div>
        </label>
    </div>

</body>
</html>
